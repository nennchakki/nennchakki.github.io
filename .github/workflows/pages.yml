# GitHub Pages への公開。
# 原稿ディレクトリは CI にないので、リポジトリに入れた公開用スナップショット（content/）だけからビルドする。
# スナップショットの更新は、手元で `npm run snapshot` を実行し、差分を確かめてからコミットする。
# 原稿を保存しただけでは公開されない。
#
# アクションはどれも Node.js 24 で動く版（checkout v7, setup-node v7, upload-pages-artifact v5, deploy-pages v5）。
#
# 使うには、リポジトリの Settings → Pages → Build and deployment → Source を
# 「GitHub Actions」に切り替える（いまは main ブランチのルートから公開する設定）。
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
